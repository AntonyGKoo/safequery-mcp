[project]
name = "safequery-mcp"
version = "0.1.0"
description = "Read-only, audited SQL gateway that lets an AI assistant query a business database over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "sqlglot>=25",
    "sqlalchemy>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3"]
sqlserver = ["pyodbc>=5"]
mysql = ["pymysql>=1"]

[project.scripts]
safequery-mcp = "safequery_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safequery_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
