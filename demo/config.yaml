# Demo configuration: a synthetic ERP database in SQLite.
# Relative paths are resolved against this file, not the working directory.

database:
  url: sqlite:///erp_demo.db
  dialect: sqlite          # sqlite | postgres | tsql | mysql

limits:
  max_rows: 50             # rows returned per query; the rest is cut off and flagged
  timeout_seconds: 5       # a query running longer than this is cancelled
  max_cell_chars: 500      # long text cells are shortened

access:
  # Only these tables are visible. `employees` (payroll) exists in the
  # database and is deliberately left out.
  allowed_tables:
    - customers
    - products
    - orders
    - order_items
    - invoices
  # Columns the assistant may never read, even from an allowed table.
  restricted_columns:
    customers: [email, phone, tax_id]

audit:
  path: audit/audit.jsonl

table_descriptions:
  customers: One row per customer account.
  products: Product catalogue with list price and unit cost.
  orders: Order headers. status is completed, pending or cancelled.
  order_items: Order lines. Line revenue = quantity * unit_price * (1 - discount).
  invoices: One invoice per completed order. paid_at is NULL while unpaid.
